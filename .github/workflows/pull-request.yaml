---
name: Pull Request
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - edited
    paths:
      - charts/**
permissions:
  contents: read
  pull-requests: read
env:
  KUBECONFORM_VERSION: v0.6.7
jobs:
  validate-metadata:
    name: Validate PR Metadata
    runs-on: ubuntu-24.04
    outputs:
      changed_chart: ${{ steps.detect.outputs.changed_chart }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect Changes and Validate Title
        id: detect
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          CHANGED_FILES=$(git diff --name-only origin/$BASE_REF HEAD | grep '^charts/' || true)
          if [ -z "$CHANGED_FILES" ]; then
            echo "No charts changed."
            exit 0
          fi
          CHANGED_CHARTS=$(echo "$CHANGED_FILES" | cut -d'/' -f1,2 | sort -u)
          CHART_COUNT=$(echo "$CHANGED_CHARTS" | wc -w)
          if [ "$CHART_COUNT" -gt 1 ]; then
            echo "::error::Multiple charts changed ($CHART_COUNT). Please create separate PRs for each chart."
            echo "Changed charts: $CHANGED_CHARTS"
            exit 1
          fi
          CHART_PATH="$CHANGED_CHARTS"
          CHART_NAME=$(basename "$CHART_PATH")
          if [[ "${PR_TITLE#\[$CHART_NAME\] }" == "$PR_TITLE" ]]; then
            echo "::error::PR title must start with '[$CHART_NAME] '."
            exit 1
          fi
          echo "changed_chart=$CHART_PATH" >> "$GITHUB_OUTPUT"
  helm-validate:
    name: Helm Validate
    needs: validate-metadata
    if: needs.validate-metadata.outputs.changed_chart != ''
    runs-on: ubuntu-24.04
    env:
      CHART_PATH: ${{ needs.validate-metadata.outputs.changed_chart }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Helm
        uses: azure/setup-helm@v4
      - name: Install kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kubeconform
      - name: Check chart version bump
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          NEW_VERSION=$(yq '.version' "$CHART_PATH/Chart.yaml")
          if ! git cat-file -e "origin/$BASE_REF:$CHART_PATH/Chart.yaml" 2>/dev/null; then
            echo "New chart $CHART_PATH at version $NEW_VERSION."
            exit 0
          fi
          OLD_VERSION=$(git show "origin/$BASE_REF:$CHART_PATH/Chart.yaml" | yq '.version')
          if [ "$NEW_VERSION" = "$OLD_VERSION" ]; then
            echo "::error file=$CHART_PATH/Chart.yaml::Chart version $OLD_VERSION is unchanged. Bump 'version' in Chart.yaml."
            exit 1
          fi
          if [ "$(printf '%s\n%s\n' "$OLD_VERSION" "$NEW_VERSION" | sort -V | tail -n1)" != "$NEW_VERSION" ]; then
            echo "::error file=$CHART_PATH/Chart.yaml::Chart version $NEW_VERSION is lower than $OLD_VERSION."
            exit 1
          fi
          echo "Chart version $OLD_VERSION -> $NEW_VERSION"
      - name: Lint and validate each value set
        run: |
          set -euo pipefail
          shopt -s nullglob
          VALUE_FILES=("$CHART_PATH"/ci/*-values.yaml)
          if [ ${#VALUE_FILES[@]} -eq 0 ]; then
            VALUE_FILES=("")
          fi
          for values in "${VALUE_FILES[@]}"; do
            args=()
            if [ -n "$values" ]; then
              args=(-f "$values")
            fi
            echo "::group::${values:-default values}"
            helm lint "$CHART_PATH" "${args[@]}"
            helm template test-release "$CHART_PATH" --include-crds "${args[@]}" \
              | kubeconform -strict -ignore-missing-schemas -summary
            echo "::endgroup::"
          done
      - name: Run helm install (dry-run)
        run: |-
          echo "Validating install for $CHART_PATH"
          helm install test-release "$CHART_PATH" --dry-run=client --debug
