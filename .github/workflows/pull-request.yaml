---
name: Pull Request
# No paths filter: "Validate PR Metadata" and "Helm Validate" are required
# checks, so they must report on every PR (Helm Validate is skipped, which
# counts as passing, when no chart changed).
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - edited
permissions:
  contents: read
  pull-requests: read
env:
  KUBECONFORM_VERSION: v0.6.7
jobs:
  validate-metadata:
    name: Validate PR Metadata
    runs-on: ubuntu-24.04
    outputs:
      changed_charts: ${{ steps.detect.outputs.changed_charts }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # A PR may change several charts; its title must start with one tag per
      # changed chart, e.g. "[koptan][koptan-ui] sync with koptan 0.1.0".
      - name: Detect Changes and Validate Title
        id: detect
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          CHARTS=""
          for dir in $(git diff --name-only "origin/$BASE_REF" HEAD -- charts/ | cut -d/ -f1,2 | sort -u); do
            # Only chart directories that still exist (not deleted charts or files under charts/).
            if [ -f "$dir/Chart.yaml" ]; then
              CHARTS="$CHARTS $dir"
            fi
          done
          CHARTS="${CHARTS# }"
          if [ -z "$CHARTS" ]; then
            echo "No charts changed."
            exit 0
          fi
          TAGS=$(grep -oE '^(\[[A-Za-z0-9._-]+\])+' <<<"$PR_TITLE" | grep -oE '[A-Za-z0-9._-]+' || true)
          MISSING=""
          for dir in $CHARTS; do
            name=$(basename "$dir")
            if ! grep -qxF "$name" <<<"$TAGS"; then
              MISSING="${MISSING}[$name]"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::PR title must start with a tag per changed chart; missing $MISSING (changed: $CHARTS)."
            exit 1
          fi
          echo "Changed charts: $CHARTS"
          echo "changed_charts=$CHARTS" >> "$GITHUB_OUTPUT"
  # One job with a stable name (a required check) that validates every
  # changed chart.
  helm-validate:
    name: Helm Validate
    needs: validate-metadata
    if: needs.validate-metadata.outputs.changed_charts != ''
    runs-on: ubuntu-24.04
    env:
      CHARTS: ${{ needs.validate-metadata.outputs.changed_charts }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Helm
        uses: azure/setup-helm@v4
      - name: Install kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kubeconform
      - name: Check chart version bump
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          for CHART_PATH in $CHARTS; do
            NEW_VERSION=$(yq '.version' "$CHART_PATH/Chart.yaml")
            if ! git cat-file -e "origin/$BASE_REF:$CHART_PATH/Chart.yaml" 2>/dev/null; then
              echo "New chart $CHART_PATH at version $NEW_VERSION."
              continue
            fi
            OLD_VERSION=$(git show "origin/$BASE_REF:$CHART_PATH/Chart.yaml" | yq '.version')
            if [ "$NEW_VERSION" = "$OLD_VERSION" ]; then
              echo "::error file=$CHART_PATH/Chart.yaml::Chart version $OLD_VERSION is unchanged. Bump 'version' in Chart.yaml."
              exit 1
            fi
            if [ "$(printf '%s\n%s\n' "$OLD_VERSION" "$NEW_VERSION" | sort -V | tail -n1)" != "$NEW_VERSION" ]; then
              echo "::error file=$CHART_PATH/Chart.yaml::Chart version $NEW_VERSION is lower than $OLD_VERSION."
              exit 1
            fi
            echo "$CHART_PATH: chart version $OLD_VERSION -> $NEW_VERSION"
          done
      - name: Lint and validate each value set
        run: |
          set -euo pipefail
          shopt -s nullglob
          for CHART_PATH in $CHARTS; do
            VALUE_FILES=("$CHART_PATH"/ci/*-values.yaml)
            if [ ${#VALUE_FILES[@]} -eq 0 ]; then
              VALUE_FILES=("")
            fi
            for values in "${VALUE_FILES[@]}"; do
              args=()
              if [ -n "$values" ]; then
                args=(-f "$values")
              fi
              echo "::group::$CHART_PATH ${values:-default values}"
              helm lint "$CHART_PATH" "${args[@]}"
              helm template test-release "$CHART_PATH" --include-crds "${args[@]}" \
                | kubeconform -strict -ignore-missing-schemas -summary
              echo "::endgroup::"
            done
          done
      - name: Run helm install (dry-run)
        run: |-
          set -euo pipefail
          for CHART_PATH in $CHARTS; do
            echo "Validating install for $CHART_PATH"
            helm install test-release "$CHART_PATH" --dry-run=client --debug
          done
