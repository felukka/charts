---
name: Release Charts
on:
  push:
    branches:
      - main
    paths:
      - charts/**
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Helm
        uses: azure/setup-helm@v4
      - name: Lint Charts
        run: |
          for dir in charts/*; do
            if [ -d "$dir" ]; then
              helm lint "$dir"
            fi
          done
  release:
    needs: lint
    permissions:
      contents: read
      packages: write
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    env:
      REPO_URL: https://charts.felukka.org
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Helm
        uses: azure/setup-helm@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Chart Release Directory
        run: |
          mkdir -p .chart-release
          for dir in charts/*; do
            if [ -d "$dir" ]; then
              helm package "$dir" --destination .chart-release/
            fi
          done
      # Charts live under ghcr.io/<owner>/charts/<name>, apart from the images
      # (ghcr.io/<owner>/<name>) so chart and image tags never collide.
      # A chart version is published once; re-running a release never overwrites it.
      - name: Push charts to GHCR
        run: |
          shopt -s nullglob
          for pkg in .chart-release/*.tgz; do
            name=$(tar -xzOf "$pkg" --wildcards '*/Chart.yaml' | yq '.name')
            version=$(tar -xzOf "$pkg" --wildcards '*/Chart.yaml' | yq '.version')
            if helm show chart "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts/${name}" --version "$version" >/dev/null 2>&1; then
              echo "${name} ${version} is already published, skipping"
              continue
            fi
            helm push "${pkg}" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"
          done
      # Pages is replaced on every deploy, so fetch the packages already published
      # and merge the old index; otherwise older versions disappear from the repo.
      - name: Fetch published packages
        run: |
          set -euo pipefail
          if ! curl -fsSL "${REPO_URL}/index.yaml" -o old-index.yaml; then
            rm -f old-index.yaml
            echo "No published index yet."
            exit 0
          fi
          yq '.entries[][].urls[0]' old-index.yaml | while read -r url; do
            case "$url" in
              http*) ;;
              *) url="${REPO_URL}/${url}" ;;
            esac
            curl -fsSL "$url" -o ".chart-release/$(basename "$url")"
          done
      - name: Generate Repository Index
        run: |
          if [ -f old-index.yaml ]; then
            helm repo index .chart-release/ --url "${REPO_URL}" --merge old-index.yaml
          else
            helm repo index .chart-release/ --url "${REPO_URL}"
          fi
      - name: Prepare Pages directory
        run: |
          cp README.md .chart-release/
          echo "charts.felukka.org" > .chart-release/CNAME
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .chart-release
  deploy:
    needs: release
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
