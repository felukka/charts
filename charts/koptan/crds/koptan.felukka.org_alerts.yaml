---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: alerts.koptan.felukka.org
spec:
  group: koptan.felukka.org
  names:
    kind: Alert
    listKind: AlertList
    plural: alerts
    singular: alert
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.serviceRef.name
      name: Service
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .spec.suspend
      name: Suspended
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          Alert sends Slack, Teams or webhook notifications about a Service's
          pushes, builds and deployments.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AlertSpec says which Services to watch, which events to send
              and where.
            properties:
              channels:
                items:
                  description: |-
                    AlertChannel is one destination. The URL lives in a Secret because Slack
                    and Teams webhook URLs are credentials.
                  properties:
                    name:
                      description: Name identifies the channel in the status.
                      pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$
                      type: string
                    signingSecretRef:
                      description: |-
                        SigningSecretRef, for type webhook, signs each body with HMAC-SHA256
                        in the X-Koptan-Signature header (sha256=<hex>).
                      properties:
                        key:
                          description: The key of the secret to select from.  Must
                            be a valid secret key.
                          type: string
                        name:
                          default: ""
                          description: |-
                            Name of the referent.
                            This field is effectively required, but due to backwards compatibility is
                            allowed to be empty. Instances of this type with an empty value here are
                            almost certainly wrong.
                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                          type: string
                        optional:
                          description: Specify whether the Secret or its key must
                            be defined
                          type: boolean
                      required:
                      - key
                      type: object
                      x-kubernetes-map-type: atomic
                    type:
                      description: ChannelType is where a notification goes.
                      enum:
                      - slack
                      - teams
                      - webhook
                      type: string
                    urlSecretRef:
                      description: |-
                        URLSecretRef holds the incoming webhook URL (https; plain http is
                        allowed for type webhook only).
                      properties:
                        key:
                          description: The key of the secret to select from.  Must
                            be a valid secret key.
                          type: string
                        name:
                          default: ""
                          description: |-
                            Name of the referent.
                            This field is effectively required, but due to backwards compatibility is
                            allowed to be empty. Instances of this type with an empty value here are
                            almost certainly wrong.
                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                          type: string
                        optional:
                          description: Specify whether the Secret or its key must
                            be defined
                          type: boolean
                      required:
                      - key
                      type: object
                      x-kubernetes-map-type: atomic
                  required:
                  - name
                  - type
                  - urlSecretRef
                  type: object
                maxItems: 10
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              events:
                description: Events to send; empty means all of them.
                items:
                  description: AlertEvent is a pipeline event an Alert can notify
                    about.
                  enum:
                  - Push
                  - CIStarted
                  - CISucceeded
                  - CIFailed
                  - CDDeploying
                  - CDSucceeded
                  - CDFailed
                  type: string
                maxItems: 7
                type: array
                x-kubernetes-list-type: set
              selector:
                description: Selector selects Services in the Alert's namespace by
                  label.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              serviceRef:
                description: ServiceRef selects one Service in the Alert's namespace.
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              suspend:
                description: Suspend stops sending; events that happen meanwhile are
                  skipped.
                type: boolean
            required:
            - channels
            type: object
            x-kubernetes-validations:
            - message: set serviceRef or selector
              rule: has(self.serviceRef) || has(self.selector)
          status:
            description: AlertStatus tracks what was sent, so nothing is sent twice.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              deliveries:
                description: Deliveries are the most recent notification attempts,
                  newest first.
                items:
                  description: AlertDelivery records one notification attempt.
                  properties:
                    channel:
                      type: string
                    error:
                      type: string
                    event:
                      description: AlertEvent is a pipeline event an Alert can notify
                        about.
                      enum:
                      - Push
                      - CIStarted
                      - CISucceeded
                      - CIFailed
                      - CDDeploying
                      - CDSucceeded
                      - CDFailed
                      type: string
                    revision:
                      type: string
                    service:
                      type: string
                    success:
                      type: boolean
                    time:
                      format: date-time
                      type: string
                  required:
                  - channel
                  - event
                  - service
                  - success
                  - time
                  type: object
                maxItems: 20
                type: array
              initialized:
                description: |-
                  Initialized is set once the state at creation has been recorded;
                  an Alert reports what happens after it exists.
                type: boolean
              lastNotified:
                additionalProperties:
                  type: string
                description: |-
                  LastNotified maps <service>/<event>/<channel> to the key of the last
                  event handled, e.g. the commit SHA or the build Pod.
                type: object
              observedGeneration:
                format: int64
                type: integer
            type: object
        required:
        - metadata
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
