          metadata:
            type: object
          spec:
            description: CIPluginSpec is a step that runs after checkout and before
              build/push.
            properties:
              codeql:
                description: CodeQLConfig analyzes the source with the CodeQL CLI.
                properties:
                  bundleURL:
                    description: BundleURL overrides the CodeQL bundle download.
                    pattern: ^https://[^\s]+$
