                    items:
                      type: string
                    type: array
                  hostURL:
                    description: HostURL of the SonarQube server.
                    pattern: ^https?://[^\s]+$
                    type: string
                  image:
                    description: Image overrides the scanner image.
                    type: string
                  projectKey:
                    description: ProjectKey defaults to <namespace>_<service>.
                    maxLength: 400
                    type: string
                  tokenSecretRef:
                    description: TokenSecretRef holds the analysis token.
                    properties:
                      key:
                        description: The key of the secret to select from.  Must be
                          a valid secret key.
                        type: string
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                      optional:
                        description: Specify whether the Secret or its key must be
                          defined
                        type: boolean
                    required:
                    - key
                    type: object
                    x-kubernetes-map-type: atomic
                  waitForQualityGate:
                    default: true
                    description: WaitForQualityGate fails the step when the quality
                      gate fails.
                    type: boolean
                required:
                - hostURL
                - tokenSecretRef
                type: object
              targetRefs:
                description: |-
                  TargetRefs attach the plugin to Services by name, in addition to
                  Services that list it in spec.plugins.
                items:
                  description: PluginTargetRef attaches a plugin to a Service in the
                    plugin's namespace.
                  properties:
                    kind:
                      default: Service
                      enum:
                      - Service
                      type: string
                    name:
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                maxItems: 64
                type: array
              type:
                description: CIPluginType selects the built-in renderer for a plugin.
                enum:
                - sonarqube
                - codeql
                - custom
                type: string
            required:
            - type
            type: object
            x-kubernetes-validations:
            - message: type sonarqube needs spec.sonarqube
              rule: self.type != 'sonarqube' || has(self.sonarqube)
            - message: type codeql needs spec.codeql
              rule: self.type != 'codeql' || has(self.codeql)
            - message: type custom needs spec.custom
              rule: self.type != 'custom' || has(self.custom)
          status:
            description: CIPluginStatus reports whether the plugin is usable and where
              it runs.
            properties:
              attachedServices:
                description: AttachedServices lists the Services whose builds run
                  this plugin.
                items:
                  type: string
                type: array
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
