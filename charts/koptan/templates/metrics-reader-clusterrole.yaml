{{- if and .Values.metrics.secure .Values.certManager.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "koptan.fullname" . }}-metrics-reader
  labels:
    {{- include "koptan.labels" . | nindent 4 }}
rules:
  - nonResourceURLs:
      - /metrics
    verbs:
      - get
{{- end }}
