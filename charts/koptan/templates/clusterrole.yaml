apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "koptan.fullname" . }}-manager-role
  labels:
    {{- include "koptan.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
      - services
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - create
      - delete
      - deletecollection
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - koptan.felukka.org
    resources:
      - alerts
      - ciplugins
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - koptan.felukka.org
    resources:
      - alerts/status
      - cds/status
      - ciplugins/status
      - cis/status
      - selfservices/status
      - services/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - koptan.felukka.org
    resources:
      - cds
      - cis
      - services
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - koptan.felukka.org
    resources:
      - cds/finalizers
      - cis/finalizers
      - selfservices/finalizers
      - services/finalizers
    verbs:
      - update
  - apiGroups:
      - koptan.felukka.org
    resources:
      - selfservices
    verbs:
      - get
      - list
      - patch
      - update
      - watch
