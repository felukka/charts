{{- if and .Values.webhook.enabled .Values.certManager.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "koptan.fullname" . }}-validating-webhook-configuration
  labels:
    {{- include "koptan.labels" . | nindent 4 }}
  {{- if .Values.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "koptan.fullname" . }}-serving-cert
  {{- end }}
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: {{ include "koptan.fullname" . }}-webhook-service
        namespace: {{ .Release.Namespace }}
        path: /validate-koptan-felukka-sh-v1alpha-goapp
    failurePolicy: Fail
    name: vgoapp-v1alpha.kb.io
    rules:
      - apiGroups:
          - koptan.felukka.sh
        apiVersions:
          - v1alpha
        operations:
          - CREATE
          - UPDATE
        resources:
          - goapps
    sideEffects: None
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: {{ include "koptan.fullname" . }}-webhook-service
        namespace: {{ .Release.Namespace }}
        path: /validate-koptan-felukka-sh-v1alpha-javaapp
    failurePolicy: Fail
    name: vjavaapp-v1alpha.kb.io
    rules:
      - apiGroups:
          - koptan.felukka.sh
        apiVersions:
          - v1alpha
        operations:
          - CREATE
          - UPDATE
        resources:
          - javaapps
    sideEffects: None
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: {{ include "koptan.fullname" . }}-webhook-service
        namespace: {{ .Release.Namespace }}
        path: /validate-koptan-felukka-sh-v1alpha-slipway
    failurePolicy: Fail
    name: vslipway-v1alpha.kb.io
    rules:
      - apiGroups:
          - koptan.felukka.sh
        apiVersions:
          - v1alpha
        operations:
          - CREATE
          - UPDATE
        resources:
          - slipways
    sideEffects: None
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: {{ include "koptan.fullname" . }}-webhook-service
        namespace: {{ .Release.Namespace }}
        path: /validate-koptan-felukka-sh-v1alpha-voyage
    failurePolicy: Fail
    name: vvoyage-v1alpha.kb.io
    rules:
      - apiGroups:
          - koptan.felukka.sh
        apiVersions:
          - v1alpha
        operations:
          - CREATE
          - UPDATE
        resources:
          - voyages
    sideEffects: None
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: {{ include "koptan.fullname" . }}-webhook-service
        namespace: {{ .Release.Namespace }}
        path: /validate-koptan-felukka-sh-v1alpha-dotnetapp
    failurePolicy: Fail
    name: vdotnetapp-v1alpha.kb.io
    rules:
      - apiGroups:
          - koptan.felukka.sh
        apiVersions:
          - v1alpha
        operations:
          - CREATE
          - UPDATE
        resources:
          - dotnetapps
    sideEffects: None
{{- end }}
