---
replicaCount: 1
controller:
  image:
    repository: ghcr.io/felukka/koptan
    # Defaults to the chart appVersion.
    tag: ""
    pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: controller-manager

# Registry used when a Service sets no spec.image.registry.
defaultRegistry: docker.io

# Koptan resources may only use Secrets labelled
# koptan.felukka.org/credentials=true. Setting this to true accepts any
# Secret, which lets whoever can create a Service send any Secret in its
# namespace to a host of their choice. Only for migrating old installs.
allowUnlabeledSecrets: false

# Registry hosts (host or host:port) that builds may pull from and push to
# over plain HTTP or with an untrusted certificate, e.g. an in-cluster
# registry:2. Every other registry keeps TLS verification.
# insecureRegistries:
#   - registry.registry.svc:5000
insecureRegistries: []

# SelfService agent sessions.
agent:
  # Pinned; an agent release of koptan bumps it.
  image: ghcr.io/felukka/koptan-agent:0.0.4
  # Secret holding the key that derives each agent's API token. The Backstage
  # backend needs the same value. The Secret is optional; without it
  # SelfServices are disabled.
  keySecret:
    name: koptan-agent-key
    key: key

# Discovery clones repositories into /tmp; the root filesystem stays read-only.
tmpVolume:
  sizeLimit: 2Gi

# Extra environment variables for the manager container.
extraEnv: []

podAnnotations: {}
podLabels: {}
# Merged into the pod securityContext (runAsNonRoot and RuntimeDefault seccomp are always set).
podSecurityContext: {}
# Merged into the container securityContext (read-only root, no privilege escalation, all capabilities dropped).
securityContext: {}
resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi
volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}

certManager:
  # Requires cert-manager CRDs to be installed in the cluster.
  # See https://cert-manager.io/docs/installation/
  enabled: false

metrics:
  # Serve metrics over HTTPS on metrics.port. With certManager.enabled the
  # endpoint gets a cert-manager certificate, a Service and RBAC.
  secure: false
  port: 8443

# RBAC for the Backstage backend plugin (koptan-backend).
backstage:
  rbac:
    create: false
    # Bind the role to this service account when name is set.
    serviceAccount:
      name: ""
      namespace: ""
